name: Scrape APK, Dump Il2Cpp & Extract Game Data

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up .NET Runtime (for Il2CppDumper)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dnfile requests

      - name: Execute Pipeline (Scrape -> Download -> Dump -> Extract)
        run: |
          python pipeline.py

      - name: Commit and Push Game Data Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes in game data detected. Skipping commit."
          else
            git commit -m "Automated update: latest Otherworld Legends game data [skip ci]"
            git push
          fi
